name: Acquire public hydrology data

on:
  workflow_dispatch:
  push:
    branches:
      - map-details-upgrade
    paths:
      - "scripts/acquire_public_hydrology_data.py"
      - "scripts/acquire_map_reference_data.py"
      - "scripts/audit_map_reference_raster.py"
      - "tests/test_map_reference_acquisition.py"
      - "tests/test_map_reference_raster_audit.py"
      - "scripts/audit_public_hydrology_data.py"
      - "scripts/audit_ifi_flood_inventory.py"
      - "scripts/audit_indofloods.py"
      - "tests/test_indofloods_audit.py"
      - "data/reference/public_data_sources.json"
      - ".github/workflows/acquire-public-hydrology-data.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check pandas rasterio

      - name: Test public-data acquisition safeguards
        run: python -m unittest discover -s tests -p 'test_public_data_acquisition.py' -v

      - name: Test IFI inventory audit safeguards
        run: python -m unittest discover -s tests -p 'test_ifi_flood_inventory_audit.py' -v

      - name: Test INDOFLOODS audit safeguards
        run: python -m unittest discover -s tests -p 'test_indofloods_audit.py' -v

      - name: Test map-reference acquisition safeguards
        run: python -m unittest discover -s tests -p 'test_map_reference_acquisition.py' -v

      - name: Test raster metadata and coverage audit
        run: python -m unittest discover -s tests -p 'test_map_reference_raster_audit.py' -v

      - name: Download catalogued source CSVs and write provenance
        id: acquisition
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/acquire_public_hydrology_data.py --list
          python scripts/acquire_public_hydrology_data.py --all 2>&1 | tee acquisition.log

      - name: Audit acquired source files without changing raw data
        if: always() && steps.acquisition.outcome == 'success'
        run: python scripts/audit_public_hydrology_data.py --input-dir data/external/raw --output data/external/audit_report.json

      - name: Audit independent IFI-Impacts flood inventory
        if: always() && steps.acquisition.outcome == 'success'
        run: python scripts/audit_ifi_flood_inventory.py --input-dir data/external/raw --output data/external/ifi_audit_report.json

      - name: Audit INDOFLOODS gauge-event dataset
        if: always() && steps.acquisition.outcome == 'success'
        run: python scripts/audit_indofloods.py --input-dir data/external/raw --output data/external/indofloods_audit_report.json

      - name: Acquire candidate health-facility GIS, Kochi boundary and KSDMA flood-hazard archive
        id: map_acquisition
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/acquire_map_reference_data.py 2>&1 | tee map_acquisition.log

      - name: Inspect raster CRS, bounds, units, NoData and sample values
        id: raster_audit
        if: always() && steps.map_acquisition.outcome == 'success'
        continue-on-error: true
        run: python scripts/audit_map_reference_raster.py --output data/external/map_reference/raster_metadata_audit.json

      - name: Upload raw data, audit and provenance as a short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-hydrology-source-bundle
          path: |
            data/external/raw/**
            data/external/map_reference/**
            data/external/download_manifest.json
            data/external/audit_report.json
            data/external/ifi_audit_report.json
            data/external/indofloods_audit_report.json
            acquisition.log
            map_acquisition.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize acquisition status
        if: always()
        run: |
          {
            echo "## Public hydrology data acquisition"
            echo ""
            echo "This workflow downloads source files to a temporary artifact; it does not commit raw datasets."
            echo ""
            if [ "${{ steps.acquisition.outcome }}" = "success" ]; then
              echo "**Result:** All registered downloads completed. Raw files remain unvalidated until source-specific audit review."
            else
              echo "**Result:** One or more registered downloads failed. Check the acquisition log and artifact; no failed source is treated as validated."
            fi
            echo ""
            echo "Downloaded bytes are marked downloaded_raw_unvalidated. SHA-256 and retrieval metadata are recorded where a download succeeds."
            echo "IFI audit is descriptive only: district/event records are not converted into ward-level or hourly flood labels."
            echo ""
            if [ "${{ steps.map_acquisition.outcome }}" = "success" ]; then
              echo "**Map reference acquisition:** Candidate Ernakulam public health-facility points, Kochi boundary candidate and KSDMA flood-return raster archive downloaded with SHA-256 provenance. These remain unvalidated candidates; they are not automatically shown on the map."
              if [ "${{ steps.raster_audit.outcome }}" = "success" ]; then
                echo "**Raster metadata audit:** Completed. Review raster_metadata_audit.json for CRS, bounds, resolution, units, NoData, sampled values, and Kochi screening-box overlap. Metadata inspection does not approve the layer for display."
              else
                echo "**Raster metadata audit:** Not completed successfully. Treat the raster as blocked until the audit log and artifact are reviewed."
              fi
            else
              echo "**Map reference acquisition:** One or more spatial source downloads or structural checks failed. Review map_acquisition.log and the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if any registered download failed
        if: always()
        run: |
          if [ "${{ steps.acquisition.outcome }}" != "success" ]; then
            echo "One or more registered data downloads failed. Review the acquisition log and artifact."
            exit 1
          fi

      - name: Fail workflow if spatial acquisition or raster audit failed
        if: always()
        run: |
          if [ "${{ steps.map_acquisition.outcome }}" != "success" ]; then
            echo "Hospital/KSDMA spatial acquisition failed or did not complete. Review map_acquisition.log and manifest."
            exit 1
          fi
          if [ "${{ steps.raster_audit.outcome }}" != "success" ]; then
            echo "Raster metadata audit failed or did not complete. Review the audit log and artifact."
            exit 1
          fi
