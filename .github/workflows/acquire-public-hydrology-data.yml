name: Acquire public hydrology data

on:
  workflow_dispatch:
  push:
    branches:
      - map-details-upgrade
    paths:
      - "scripts/acquire_public_hydrology_data.py"
      - "scripts/audit_public_hydrology_data.py"
      - "scripts/audit_ifi_flood_inventory.py"
      - "data/reference/public_data_sources.json"
      - ".github/workflows/acquire-public-hydrology-data.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Test IFI inventory audit safeguards
        run: python -m unittest discover -s tests -p 'test_ifi_flood_inventory_audit.py' -v

      - name: Download catalogued source CSVs and write provenance
        id: acquisition
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/acquire_public_hydrology_data.py --list
          python scripts/acquire_public_hydrology_data.py --all 2>&1 | tee acquisition.log

      - name: Audit acquired source files without changing raw data
        if: always() && steps.acquisition.outcome == 'success'
        run: python scripts/audit_public_hydrology_data.py --input-dir data/external/raw --output data/external/audit_report.json

      - name: Audit independent IFI-Impacts flood inventory
        if: always() && steps.acquisition.outcome == 'success'
        run: python scripts/audit_ifi_flood_inventory.py --input-dir data/external/raw --output data/external/ifi_audit_report.json

      - name: Upload raw data, audit and provenance as a short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-hydrology-source-bundle
          path: |
            data/external/raw/**
            data/external/download_manifest.json
            data/external/audit_report.json
            data/external/ifi_audit_report.json
            acquisition.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize acquisition status
        if: always()
        run: |
          {
            echo "## Public hydrology data acquisition"
            echo ""
            echo "This workflow downloads source files to a temporary artifact; it does not commit raw datasets."
            echo ""
            if [ "${{ steps.acquisition.outcome }}" = "success" ]; then
              echo "**Result:** All registered downloads completed. Raw files remain unvalidated until source-specific audit review."
            else
              echo "**Result:** One or more registered downloads failed. Check the acquisition log and artifact; no failed source is treated as validated."
            fi
            echo ""
            echo "Downloaded bytes are marked downloaded_raw_unvalidated. SHA-256 and retrieval metadata are recorded where a download succeeds."
            echo "IFI audit is descriptive only: district/event records are not converted into ward-level or hourly flood labels."
          } >> "$GITHUB_STEP_SUMMARY"
