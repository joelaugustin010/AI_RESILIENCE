name: Train historical weather hazard baselines
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/train_weather_hazard_baselines.py"
      - ".github/workflows/train-weather-baselines.yml"
permissions:
  contents: write
jobs:
  train-weather-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn joblib
      - name: Train time-split weather research baselines
        run: python scripts/train_weather_hazard_baselines.py
      - name: Store model artifacts and evaluation reports in GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add models/hazards/weather_baselines reports/weather_hazard_training.json
          if git diff --cached --quiet; then
            echo "No model artifacts or reports to commit."
          else
            git commit -m "Store weather hazard research baselines and evaluation"
            for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after refreshing main."
            sleep $((attempt * 2))
          done
          echo "Could not push generated artifacts after five retries."
          exit 1
          fi
      - name: Upload trained models and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-hazard-research-models
          path: |
            models/hazards/weather_baselines/
            reports/weather_hazard_training.json
          if-no-files-found: warn
          retention-days: 90
