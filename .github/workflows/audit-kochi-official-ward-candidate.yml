name: Audit official Kochi ward-map candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/acquire_kochi_official_ward_candidate.py"
      - ".github/workflows/audit-kochi-official-ward-candidate.yml"
      - "data/reference/kochi_official_ward_roster_2025.json"
      - "data/reference/spatial_sources.json"

permissions:
  contents: write

jobs:
  acquire-and-audit:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry validator
        run: python -m pip install --disable-pip-version-check shapely
      - name: Acquire and validate official-portal candidate
        run: python scripts/acquire_kochi_official_ward_candidate.py
      - name: Commit validated candidate data to PR branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kochi_wards_ksmart_2024_draft.json data/raw/kochi_wards_ksmart_2024_draft.metadata.json data/candidates/kochi_wards_ksmart_2024_draft_candidate.geojson data/candidates/kochi_wards_ksmart_2024_draft_candidate.metadata.json data/reference/spatial_sources.json
          if git diff --cached --quiet; then
            echo "Candidate data already up to date; no commit needed."
          else
            git commit -m "Acquire and validate Kochi draft ward-map candidate"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Verify visual-only candidate integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from shapely.geometry import shape

          candidate_path = Path("data/candidates/kochi_wards_ksmart_2024_draft_candidate.geojson")
          metadata_path = candidate_path.with_name("kochi_wards_ksmart_2024_draft_candidate.metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          features = candidate.get("features", [])
          if len(features) != 76:
              raise SystemExit(f"Expected 76 candidate features; got {len(features)}")
          codes = [feature.get("properties", {}).get("sec_ward_code") for feature in features]
          names = [feature.get("properties", {}).get("sec_ward_name") for feature in features]
          if len(set(codes)) != 76 or len(set(names)) != 76 or any(not value for value in codes + names):
              raise SystemExit("Candidate SEC ward codes/names are missing or duplicated.")
          invalid = [
              index + 1 for index, feature in enumerate(features)
              if not feature.get("geometry") or not shape(feature["geometry"]).is_valid
          ]
          if invalid:
              raise SystemExit(f"Shapely reports invalid candidate geometries: {invalid[:12]}")
          actual_hash = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          if metadata.get("processed_sha256") != actual_hash:
              raise SystemExit("Candidate sidecar hash does not match the GeoJSON.")
          print({
              "candidate_features": len(features),
              "unique_SEC_codes": len(set(codes)),
              "unique_SEC_names": len(set(names)),
              "Shapely_valid_geometries": len(features) - len(invalid),
              "source_name_mismatches": metadata.get("source_name_mismatch_count"),
              "geometry_repairs": metadata.get("geometry_repair_count"),
              "status": "DRAFT VISUAL CANDIDATE ONLY",
              "warning": "Not in strict processed-layer ingestion; not for legal or exposure analysis.",
          })
          PY
