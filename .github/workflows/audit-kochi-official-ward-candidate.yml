name: Audit official Kochi ward-map candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/acquire_kochi_official_ward_candidate.py"
      - ".github/workflows/audit-kochi-official-ward-candidate.yml"
      - "data/reference/kochi_official_ward_roster_2025.json"
      - "data/reference/spatial_sources.json"

permissions:
  contents: write

jobs:
  acquire-and-audit:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry validator
        run: python -m pip install --disable-pip-version-check shapely
      - name: Acquire and validate official-portal candidate
        run: python scripts/acquire_kochi_official_ward_candidate.py
      - name: Commit validated candidate data to PR branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kochi_wards_ksmart_2024_draft.json data/raw/kochi_wards_ksmart_2024_draft.metadata.json data/processed/spatial_layers/kochi_wards_ksmart_2024_draft_candidate.geojson data/processed/spatial_layers/kochi_wards_ksmart_2024_draft_candidate.metadata.json data/reference/spatial_sources.json
          if git diff --cached --quiet; then
            echo "Candidate data already up to date; no commit needed."
          else
            git commit -m "Acquire and validate Kochi draft ward-map candidate"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Verify candidate passes repository ingestion checks
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from src.spatial_data import read_processed_layers

          processed_root = Path("data/processed")
          candidate_path = processed_root / "spatial_layers" / "kochi_wards_ksmart_2024_draft_candidate.geojson"
          candidate_sha = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          layers = read_processed_layers(processed_root)
          candidates = [
              layer for layer in layers
              if layer["metadata"].get("dataset_id") == "kochi_wards_ksmart_2024_draft_candidate"
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  "Candidate did not pass read_processed_layers provenance/geometry gate; "
                  f"loaded candidates={len(candidates)}"
              )
          candidate = candidates[0]
          if candidate["report"]["feature_count"] != 76:
              raise SystemExit(f"Expected 76 loaded features; got {candidate['report']['feature_count']}")
          if candidate["report"]["source_sha256"] != candidate_sha:
              raise SystemExit("Loaded candidate hash does not match the stored GeoJSON.")
          print({
              "loaded_candidate_features": candidate["report"]["feature_count"],
              "provenance_valid": candidate["report"]["provenance_valid"],
              "source_name_mismatches": candidate["metadata"].get("source_name_mismatch_count"),
              "geometry_repairs": candidate["metadata"].get("geometry_repair_count"),
              "candidate_only": candidate["metadata"].get("status"),
          })
          PY
