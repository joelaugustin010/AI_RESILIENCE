name: Audit official Kochi ward-map candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/acquire_kochi_official_ward_candidate.py"
      - ".github/workflows/audit-kochi-official-ward-candidate.yml"
      - "data/reference/kochi_official_ward_roster_2025.json"
      - "data/reference/spatial_sources.json"

permissions:
  contents: write

jobs:
  acquire-and-audit:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry validator
        run: python -m pip install --disable-pip-version-check shapely
      - name: Acquire and validate official-portal candidate
        run: python scripts/acquire_kochi_official_ward_candidate.py
      - name: Commit validated candidate data to PR branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kochi_wards_ksmart_2024_draft.json data/raw/kochi_wards_ksmart_2024_draft.metadata.json data/processed/spatial_layers/kochi_wards_ksmart_2024_draft_candidate.geojson data/processed/spatial_layers/kochi_wards_ksmart_2024_draft_candidate.metadata.json data/reference/spatial_sources.json
          if git diff --cached --quiet; then
            echo "Candidate data already up to date; no commit needed."
          else
            git commit -m "Acquire and validate Kochi draft ward-map candidate"
            git push origin "HEAD:$BRANCH_NAME"
          fi
