name: Audit official Kochi ward-map candidate

on:
  push:
    branches: [fix/kochi-current-ward-count-guardrail]
    paths:
      - "scripts/acquire_kochi_official_ward_candidate.py"
      - ".github/workflows/audit-kochi-official-ward-candidate.yml"
      - "data/reference/kochi_official_ward_roster_2025.json"
      - "data/reference/spatial_sources.json"
  pull_request:
    branches: [main]
    paths:
      - "scripts/acquire_kochi_official_ward_candidate.py"
      - ".github/workflows/audit-kochi-official-ward-candidate.yml"
      - "data/reference/kochi_official_ward_roster_2025.json"
      - "data/reference/spatial_sources.json"

permissions:
  contents: write

jobs:
  acquire-and-audit:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/kochi-current-ward-count-guardrail') || (github.event_name == 'pull_request' && github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR or audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry validator
        run: python -m pip install --disable-pip-version-check shapely
      - name: Acquire and validate portal candidate
        run: python scripts/acquire_kochi_official_ward_candidate.py
      - name: Commit acquired candidate to PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/kochi_wards_ksmart_2024_draft.json data/raw/kochi_wards_ksmart_2024_draft.metadata.json data/candidates/kochi_wards_ksmart_2024_draft_candidate.geojson data/candidates/kochi_wards_ksmart_2024_draft_candidate.metadata.json data/reference/spatial_sources.json
          if git diff --cached --quiet; then
            echo "Candidate data already up to date; no commit needed."
          else
            git commit -m "Acquire and audit Kochi draft ward-map candidate"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Verify candidate structure, matched identities, geometry, and hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from shapely.geometry import shape

          candidate_path = Path("data/candidates/kochi_wards_ksmart_2024_draft_candidate.geojson")
          metadata_path = candidate_path.with_name("kochi_wards_ksmart_2024_draft_candidate.metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          features = candidate.get("features", [])
          if candidate.get("type") != "FeatureCollection" or len(features) != 76:
              raise SystemExit(f"Expected a 76-feature FeatureCollection; got {len(features)} features")

          def norm(value):
              return "".join(ch for ch in str(value).casefold() if ch.isalnum())

          labels = []
          codes = []
          names = []
          invalid = []
          for index, feature in enumerate(features, start=1):
              if not isinstance(feature, dict) or not isinstance(feature.get("properties"), dict):
                  raise SystemExit(f"Feature {index} has no properties object")
              props = feature["properties"]
              source_name = props.get("source_ward_name")
              code, name = props.get("sec_ward_code"), props.get("sec_ward_name")
              if not source_name or not str(source_name).strip():
                  raise SystemExit(f"Feature {index} has no preserved source ward label")
              labels.append(norm(source_name))
              if bool(code) != bool(name):
                  raise SystemExit(f"Feature {index} has a partial SEC identity")
              if code and name:
                  if norm(source_name) != norm(name):
                      raise SystemExit(f"Feature {index} has an SEC identity inconsistent with its source label")
                  codes.append(str(code))
                  names.append(str(name))
              geometry = feature.get("geometry")
              if not geometry:
                  invalid.append(index)
              else:
                  try:
                      geom = shape(geometry)
                      if geom.geom_type not in {"Polygon", "MultiPolygon"} or geom.is_empty or not geom.is_valid:
                          invalid.append(index)
                  except Exception:
                      invalid.append(index)
          if len(set(labels)) != 76:
              raise SystemExit("Source ward labels are missing or duplicated")
          if len(codes) != len(set(codes)) or len(names) != len(set(names)):
              raise SystemExit("Matched SEC identities are duplicated")
          if invalid:
              raise SystemExit(f"Invalid/non-polygon candidate geometries: {invalid[:12]}")
          matched = len(codes)
          if metadata.get("matched_official_ward_count") != matched:
              raise SystemExit(f"Metadata says {metadata.get('matched_official_ward_count')} matched identities; audited {matched}")
          if metadata.get("source_name_mismatch_count") != 76 - matched:
              raise SystemExit("Mismatch count does not agree with exact-name identity matching")
          actual_hash = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          if metadata.get("processed_sha256") != actual_hash:
              raise SystemExit("Candidate sidecar hash does not match the GeoJSON")
          if metadata.get("validation", {}).get("source_sha256") != actual_hash:
              raise SystemExit("Candidate validation hash does not match the GeoJSON")
          print({
              "candidate_features": len(features),
              "source_labels": len(set(labels)),
              "exact_SEC_identity_matches": matched,
              "unmatched_draft_labels": 76 - matched,
              "valid_polygon_geometries": len(features) - len(invalid),
              "status": "DRAFT VISUAL CANDIDATE ONLY",
              "warning": "Passing this audit does not establish final-Gazette geometry or authorize ward-level exposure analysis."
          })
          PY
