name: Acquire Kochi ward boundary reference candidate
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/acquire_kochi_ward_boundary_candidate.py"
      - ".github/workflows/acquire-kochi-ward-reference.yml"
permissions:
  contents: write
jobs:
  acquire-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry comparison dependencies
        run: python -m pip install --upgrade pip shapely pyproj
      - name: Acquire and audit raw ward candidate
        run: python scripts/acquire_kochi_ward_boundary_candidate.py
      - name: Commit source candidate and provenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/external/map_reference/kochi_wards_2024_candidate.kml data/external/map_reference/kochi_wards_2024_candidate.metadata.json
          git commit -m "Store audited Kochi ward boundary candidate" || echo "No candidate changes to commit."
          git push
      - name: Upload acquisition audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kochi-ward-boundary-candidate-audit
          path: data/external/map_reference/kochi_wards_2024_candidate*
          if-no-files-found: warn
          retention-days: 30
