name: Acquire Kochi ward boundary reference candidate
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/acquire_kochi_ward_boundary_candidate.py"
      - "scripts/reconcile_kochi_ward_labels.py"
      - ".github/workflows/acquire-kochi-ward-reference.yml"
permissions:
  contents: write
jobs:
  acquire-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry comparison dependencies
        run: python -m pip install --upgrade pip shapely pyproj
      - name: Acquire and audit raw ward candidate
        run: python scripts/acquire_kochi_ward_boundary_candidate.py
      - name: Rank missing-label geometry matches without changing source data
        run: python scripts/reconcile_kochi_ward_labels.py
      - name: Commit source candidate, provenance, and reconciliation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -f data/external/map_reference/kochi_wards_2024_candidate.kml data/external/map_reference/kochi_wards_2024_candidate.metadata.json reports/kochi_ward_label_reconciliation.json
          git commit -m "Store audited Kochi ward boundary candidate" || echo "No candidate changes to commit."
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after refreshing main."
            sleep $((attempt * 2))
          done
          echo "Could not push generated artifacts after five retries."
          exit 1
      - name: Upload acquisition audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kochi-ward-boundary-candidate-audit
          path: |
            data/external/map_reference/kochi_wards_2024_candidate*
            reports/kochi_ward_label_reconciliation.json
          if-no-files-found: warn
          retention-days: 30
