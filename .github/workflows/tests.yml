name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app.py"
      - "app_pages/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "test_*.py"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: ai-resilience-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Record resolved dependency versions
        run: python -m pip freeze
      - name: Check NumPy, SciPy, and scikit-learn imports
        run: >-
          python -c "import numpy, scipy, sklearn; from scipy.ndimage import label;
          label(numpy.array([[1]], dtype=numpy.uint8));
          print(f'numpy={numpy.__version__} scipy={scipy.__version__} scikit-learn={sklearn.__version__}')"
      - name: Compile application and research scripts
        run: python -m compileall -q app.py app_pages src scripts

      - name: Run clean-checkout test suite
        run: python -m pytest -q -ra --strict-markers

  rainfall-regression-research:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'research/nextday-rainfall-regression-') || startsWith(github.head_ref, 'research/rainfall-') || startsWith(github.head_ref, 'milestone/kochi-cyclone-flood-resilience-')))
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Train and evaluate next-day rainfall research baseline
        run: python scripts/train_nextday_rainfall_regression.py
      - name: Upload research model and evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: nextday-rainfall-research-${{ github.sha }}
          path: models/hazards/rainfall_regression/
          if-no-files-found: error
          retention-days: 14

  cyclone-best-track-audit:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'milestone/kochi-cyclone-flood-resilience-')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Acquire and audit IMD/RSMC cyclone best-track source
        run: python scripts/acquire_cyclone_best_track.py --output-dir data/external/cyclone_best_track
      - name: Upload audit report and acquisition manifest only
        uses: actions/upload-artifact@v4
        with:
          name: kochi-cyclone-best-track-audit-${{ github.sha }}
          path: |
            data/external/cyclone_best_track/cyclone_best_track_audit.json
            data/external/cyclone_best_track/acquisition_manifest.json
          if-no-files-found: error
          retention-days: 14

  flood-event-baseline:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'milestone/kochi-cyclone-flood-resilience-')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt pytest
      - name: Test flood privacy and feature-timing safeguards
        run: python -m pytest -q tests/test_flood_event_severity_baseline.py tests/test_indofloods_audit.py
      - name: Acquire and checksum-verify INDOFLOODS source tables
        run: python scripts/acquire_indofloods.py
      - name: Train exploratory gauge-transfer baseline
        run: >-
          python scripts/train_flood_event_severity_baseline.py
          --raw-dir data/external/raw
          --model-out models/flood_event_severity_baseline.joblib
          --report-out reports/flood_event_severity_baseline.json
      - name: Upload evaluation report only
        uses: actions/upload-artifact@v4
        with:
          name: kochi-flood-research-evaluation-${{ github.sha }}
          path: reports/flood_event_severity_baseline.json
          if-no-files-found: error
          retention-days: 14
