name: Python tests

on:
  pull_request:
    branches: [main, 'integration/**']
  push:
    branches: [main, 'ui/**']
    paths:
      - "app.py"
      - "app_pages/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "test_*.py"
      - "requirements*.txt"
      - "models/ml/**"
      - "reports/ml_*.json"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: ai-resilience-tests-${{ github.ref }}
  # Keep an active full test + research-training run alive when a newer commit is pushed.
  # GitHub retains only the newest pending run for this concurrency group.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Record resolved dependency versions
        run: python -m pip freeze
      - name: Check NumPy, SciPy, and scikit-learn imports
        run: >-
          python -c "import numpy, scipy, sklearn; from scipy.ndimage import label;
          label(numpy.array([[1]], dtype=numpy.uint8));
          print(f'numpy={numpy.__version__} scipy={scipy.__version__} scikit-learn={sklearn.__version__}')"
      - name: Compile application and research scripts
        run: python -m compileall -q app.py app_pages src scripts
      - name: Verify persisted ML release artifacts and research-only status
        run: python scripts/verify_release_artifacts.py

      - name: Run clean-checkout test suite
        run: python -m pytest -q -ra --strict-markers

  live-deployment-smoke:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [test, provenance-hash-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
      - name: Verify deployed Streamlit health and application shell
        run: >-
          python scripts/verify_live_deployment.py
          --attempts 20
          --delay-seconds 15
          --timeout-seconds 15
          --output reports/live_deployment_smoke.json
      - name: Upload deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-smoke-${{ github.sha }}
          path: reports/live_deployment_smoke.json
          if-no-files-found: warn
          retention-days: 30

  provenance-hash-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify provenance hashes after Linux checkout
        run: python test_provenance_line_endings.py

  rainfall-regression-research:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'research/nextday-rainfall-regression-') || startsWith(github.head_ref, 'research/rainfall-') || startsWith(github.head_ref, 'milestone/kochi-cyclone-flood-resilience-') || startsWith(github.head_ref, 'integration/cyclone-flood-')))
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Train and evaluate next-day rainfall research baseline
        run: python scripts/train_nextday_rainfall_regression.py
      - name: Upload research model and evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: nextday-rainfall-research-${{ github.sha }}
          path: models/hazards/rainfall_regression/
          if-no-files-found: error
          retention-days: 14

  cyclone-best-track-audit:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'milestone/kochi-cyclone-flood-resilience-') || startsWith(github.head_ref, 'integration/cyclone-flood-'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Acquire and audit IMD/RSMC cyclone best-track source
        run: python scripts/acquire_cyclone_best_track.py --output-dir data/external/cyclone_best_track
      - name: Upload audit report and acquisition manifest only
        uses: actions/upload-artifact@v4
        with:
          name: kochi-cyclone-best-track-audit-${{ github.sha }}
          path: |
            data/external/cyclone_best_track/cyclone_best_track_audit.json
            data/external/cyclone_best_track/acquisition_manifest.json
          if-no-files-found: error
          retention-days: 14

  flood-event-baseline:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'milestone/kochi-cyclone-flood-resilience-') || startsWith(github.head_ref, 'integration/cyclone-flood-'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt pytest
      - name: Test flood privacy and feature-timing safeguards
        run: python -m pytest -q tests/test_flood_event_severity_baseline.py tests/test_indofloods_audit.py
      - name: Acquire and checksum-verify INDOFLOODS source tables
        run: python scripts/acquire_indofloods.py
      - name: Train exploratory gauge-transfer baseline
        run: >-
          python scripts/train_flood_event_severity_baseline.py
          --raw-dir data/external/raw
          --model-out models/flood_event_severity_baseline.joblib
          --report-out reports/flood_event_severity_baseline.json
      - name: Upload evaluation report only
        uses: actions/upload-artifact@v4
        with:
          name: kochi-flood-research-evaluation-${{ github.sha }}
          path: reports/flood_event_severity_baseline.json
          if-no-files-found: error
          retention-days: 14
  shared-ml-research-training:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'opened' && startsWith(github.head_ref, 'feature/persist-trained-ml-models-') && github.actor != 'github-actions[bot]')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Check out PR head (not the synthetic merge ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt
      - name: Retrain and evaluate all shared research models
        run: python scripts/train_shared_ml_models.py
      - name: Upload regenerated model cards and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: shared-ml-retraining-${{ github.sha }}
          path: |
            reports/ml_model_registry.json
            reports/ml_validation_report.json
            reports/ml_disaster_coverage.json
            models/ml/**/model_card.json
            models/ml/**/model.joblib
          if-no-files-found: error
          retention-days: 14
      - name: Persist freshly trained research models on the PR branch
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/ml reports/ml_model_registry.json reports/ml_validation_report.json reports/ml_disaster_coverage.json
          if (git diff --cached --quiet) {
            Write-Host "No regenerated model artifacts changed."
            exit 0
          }
          git commit -m "Persist retrained shared ML research models"
          git push origin "HEAD:${{ github.head_ref }}"

  kerala-cross-location-rainfall-research:
    if: (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'research/kerala-cross-region-weather-')) || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && startsWith(github.head_ref, 'research/kerala-cross-region-weather-'))
    # Run this isolated research experiment with its own focused preflight tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt pytest
      - name: Compile and test the research experiment
        run: |
          python -m py_compile scripts/train_kerala_cross_location_rainfall.py
          python -m pytest -q tests/test_kerala_cross_location_rainfall.py
      - name: Train spatially held-out Kerala rainfall model
        run: python scripts/train_kerala_cross_location_rainfall.py
      - name: Upload research model and evaluation card
        uses: actions/upload-artifact@v4
        with:
          name: kerala-cross-location-rainfall-${{ github.sha }}
          path: models/research/kerala_cross_location_rainfall_nextday/
          if-no-files-found: error
          retention-days: 14
  india-flood-inventory-audit:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/shared-ml-intelligence-')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Acquire and checksum-audit public India Flood Inventory v4
        run: python scripts/audit_india_flood_inventory.py --output reports/india_flood_inventory_audit.json
      - name: Upload source audit report only
        uses: actions/upload-artifact@v4
        with:
          name: india-flood-inventory-audit-${{ github.sha }}
          path: reports/india_flood_inventory_audit.json
          if-no-files-found: error
          retention-days: 14
