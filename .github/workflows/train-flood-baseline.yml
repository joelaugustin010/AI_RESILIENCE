name: Acquire INDOFLOODS and train flood research baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip pandas scikit-learn joblib
      - name: Download and verify public source data
        run: python scripts/acquire_indofloods.py
      - name: Train and evaluate baseline
        run: python scripts/train_flood_event_severity_baseline.py --raw-dir data/external/raw --model-out models/flood_event_severity_baseline.joblib --report-out reports/flood_event_severity_baseline.json
      - name: Upload raw source tables, trained model, provenance and metrics
        uses: actions/upload-artifact@v4
        with:
          name: indofloods-data-and-flood-baseline
          path: |
            data/external/raw/*_indofloods.csv
            data/external/indofloods_acquisition_manifest.json
            models/flood_event_severity_baseline.joblib
            reports/flood_event_severity_baseline.json
          if-no-files-found: error
          retention-days: 30
