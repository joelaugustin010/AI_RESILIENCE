[theme]
base = "dark"
primaryColor = "#42E0C1"
backgroundColor = "#061522"
secondaryBackgroundColor = "#102B3C"
textColor = "#E7F5F5"
font = "sans serif"

[server]
headless = true
# Required for the homepage hero video and local photography.
# Files placed in ./static are served at app/static/<path>.
enableStaticServing = true
